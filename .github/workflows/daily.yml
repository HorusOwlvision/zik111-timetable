name: Check UrGAU timetable daily

on:
  schedule:
    # 17:17 по Екатеринбургу, ежедневно (UTC+5, без перехода на летнее время)
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check official PDF and update JSON
        run: python update_schedule.py
      - name: Publish only valid changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/schedule.json
          if ! git diff --cached --quiet; then
            git commit -m 'Daily UrGAU timetable refresh'
            git push
          else
            echo 'No timetable change'
          fi
