name: STAGING groups timetable auto

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: staging-groups-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pdfplumber requests beautifulsoup4
      - name: Read timetable for all first-year groups
        run: python staging-groups/update_groups.py
      - name: Publish staging group data only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/staging_groups.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh STAGING group timetables'
            git push origin main
          else
            echo 'No group timetable changes'
          fi
